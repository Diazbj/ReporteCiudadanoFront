<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<div class="recover-container d-flex justify-content-center align-items-center py-5">
  <div class="recover-card animate__animated animate__fadeInUp shadow-lg border-0">
    
    <!-- Header Section -->
    <div class="recover-header text-center">
      <div class="icon-circle mx-auto d-flex align-items-center justify-content-center mb-4">
        <i class="fa-solid fa-key-skeleton display-4 text-white"></i>
      </div>
      <h2 class="fw-bold text-dark mb-1">Recuperar Acceso</h2>
      <p class="text-muted small text-uppercase fw-bold ls-1">Seguridad de Cuenta</p>
    </div>

    <!-- Form Section -->
    <div class="recover-body p-4 p-lg-5">
      <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()" novalidate>
        
        <div class="row g-4">
          <!-- Email -->
          <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Correo Electrónico</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" class="form-control-modern" placeholder="tu@email.com" formControlName="email">
              <button type="button" class="btn-input-action" (click)="enviarCodigo()" title="Enviar código">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
            <p class="extra-small text-muted mt-2">
              <i class="fa-solid fa-circle-info me-1"></i> Ingresa tu correo y presiona el avión para recibir el código.
            </p>
          </div>

          <!-- Code -->
          <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Código de Verificación</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-hashtag"></i></span>
              <input type="text" class="form-control-modern" placeholder="Introduce el código recibido" formControlName="codigo">
            </div>
          </div>

          <!-- New Password -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Nueva Contraseña</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
              <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control-modern pe-5" 
                     placeholder="Mín. 6 caracteres" formControlName="nuevoPassword">
              <span class="password-toggle" (click)="toggleMostrarPassword()">
                <i class="fa-solid" [ngClass]="mostrarPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Confirmar</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-shield-check"></i></span>
              <input [type]="mostrarConfirmarPassword ? 'text' : 'password'" class="form-control-modern pe-5" 
                     placeholder="Repite la contraseña" formControlName="confirmarPassword">
              <span class="password-toggle" (click)="toggleMostrarConfirmarPassword()">
                <i class="fa-solid" [ngClass]="mostrarConfirmarPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </span>
            </div>
          </div>
          
          <div *ngIf="recuperarForm.errors?.['mismatch'] && recuperarForm.get('confirmarPassword')?.touched"
               class="col-12 text-danger extra-small mt-0">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> Las contraseñas no coinciden.
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-5 d-flex flex-column flex-sm-row gap-3">
          <button type="submit" class="btn btn-success-modern flex-grow-1 py-3" 
                  [disabled]="recuperarForm.invalid || recuperarForm.errors?.['mismatch']">
            <i class="fa-solid fa-rotate me-2"></i> Actualizar Contraseña
          </button>
          
          <button type="button" class="btn btn-light-modern px-4 py-3" (click)="cancelar()">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
