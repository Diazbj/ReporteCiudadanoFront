<div class="container mt-5 pt-3 mb-5">
  <div class="card shadow rounded-4 border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">Control de Reportes</h3>
    </div>
    <div class="card-body p-4">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Categoría</th>
              <th>Ciudad</th>
              <th>Estado Actual</th>
              <th>Fecha</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let reporte of reportes">
              <td class="text-muted"><small>{{ reporte.id | slice:0:8 }}...</small></td>
              <td><strong>{{ reporte.titulo }}</strong></td>
              <td><span class="badge bg-secondary">{{ reporte.categoria }}</span></td>
              <td>{{ reporte.ciudad }}</td>
              <td>
                <span class="badge" 
                  [ngClass]="{
                    'bg-warning text-dark': reporte.estadoActual === 'PENDIENTE',
                    'bg-success': reporte.estadoActual === 'RESUELTO',
                    'bg-info text-dark': reporte.estadoActual === 'VERIFICADO',
                    'bg-danger': reporte.estadoActual === 'RECHAZADO',
                    'bg-secondary': reporte.estadoActual === 'ELIMINADO'
                  }">
                  {{ reporte.estadoActual }}
                </span>
              </td>
              <td>{{ reporte.fechaCreacion | date:'dd/MM/yyyy' }}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-primary mb-1 me-1" (click)="cambiarEstado(reporte)" title="Cambiar Estado">
                  <i class="fas fa-sync-alt"></i> Estado
                </button>
                <a class="btn btn-sm btn-outline-info mb-1" [routerLink]="['/home-usuario/reporte', reporte.id]" title="Ver Detalles">
                  <i class="fas fa-eye"></i> Ver
                </a>
              </td>
            </tr>
            <tr *ngIf="reportes.length === 0">
              <td colspan="7" class="text-center text-muted py-5">
                <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                <p class="mb-0">No se han encontrado reportes en el sistema.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
