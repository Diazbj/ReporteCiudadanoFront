<div class="main-container animate__animated animate__fadeIn">
  
  <!-- Header de la Página -->
  <div class="mb-5">
    <h2 class="fw-bold text-dark mb-1">Gestión de Categorías</h2>
    <p class="text-muted mb-0">Crea, edita y organiza las etiquetas para los reportes ciudadanos.</p>
  </div>

  <div class="row g-4">
    <!-- Formulario de Creación (Izquierda) -->
    <div class="col-lg-4">
      <div class="report-card-modern glass-card p-4 sticky-top" style="top: 100px;">
        <h4 class="fw-bold mb-4">
          <i class="fa-solid fa-folder-plus text-primary me-2"></i>
          {{editando ? 'Editar Categoría' : 'Nueva Categoría'}}
        </h4>
        
        <form [formGroup]="categoriaForm" (ngSubmit)="categoriaFormulario()" novalidate>
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted text-uppercase">Nombre</label>
            <input type="text" class="form-control rounded-3 py-2" placeholder="Ej: Infraestructura" formControlName="nombre">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-muted text-uppercase">Color</label>
            <select class="form-select rounded-3 py-2" formControlName="color">
              <option value="">Seleccione un color</option>
              <option *ngFor="let color of colores" [value]="color">{{ color }}</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small text-muted text-uppercase">Descripción</label>
            <textarea class="form-control rounded-3 py-2" rows="3" placeholder="Define para qué se usa..." formControlName="descripcion"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm" [disabled]="categoriaForm.invalid">
            <i class="fa-solid fa-check me-2"></i> {{editando ? 'Actualizar Cambios' : 'Guardar Categoría'}}
          </button>
          
          <button *ngIf="editando" type="button" class="btn btn-link w-100 mt-2 text-muted" (click)="cancelarEdicion()">
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <!-- Lista de Categorías (Derecha) -->
    <div class="col-lg-8">
      <div class="report-card-modern p-0 overflow-hidden border-0 shadow-lg">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="ps-4 py-3 text-uppercase fs-xs text-muted fw-bold">Nombre</th>
                <th class="py-3 text-uppercase fs-xs text-muted fw-bold">Color</th>
                <th class="py-3 text-uppercase fs-xs text-muted fw-bold">Descripción</th>
                <th class="pe-4 py-3 text-center text-uppercase fs-xs text-muted fw-bold">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of categoria" class="border-bottom border-light">
                <td class="ps-4 py-4">
                  <span class="fw-bold text-dark">{{item.nombre}}</span>
                </td>
                <td>
                  <span class="badge rounded-pill px-3 py-2" 
                        [style.background-color]="getHexColor(item.color)"
                        style="color: white; text-transform: uppercase; font-size: 0.65rem;">
                    {{item.color}}
                  </span>
                </td>
                <td>
                  <p class="text-muted small mb-0">{{item.descripcion}}</p>
                </td>
                <td class="pe-4 text-center">
                  <div class="d-flex justify-content-center gap-2">
                    <button class="btn btn-action edit" (click)="editarCategoria(item.id)" title="Editar">
                      <i class="fa-solid fa-pen-to-square" style="color: #4361ee;"></i>
                    </button>
                    <button class="btn btn-action delete" (click)="eliminarCategoria(item.id)" title="Eliminar">
                      <i class="fa-solid fa-trash-can" style="color: #ef4444;"></i>
                    </button>
                  </div>
                </td>
              </tr>

              <!-- Estado Vacío -->
              <tr *ngIf="categoria.length === 0">
                <td colspan="4" class="text-center py-5">
                  <i class="fa-solid fa-folder-open display-1 text-muted opacity-25"></i>
                  <p class="mt-3 text-muted">No has creado ninguna categoría aún.</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
