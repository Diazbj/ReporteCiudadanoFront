<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<div class="page-container d-flex justify-content-center align-items-center py-5">
  <div class="profile-card animate__animated animate__fadeInUp shadow-lg border-0">
    
    <!-- Profile Header/Avatar -->
    <div class="profile-header text-center">
      <div class="avatar-container position-relative mb-3">
        <div class="avatar-circle mx-auto d-flex align-items-center justify-content-center">
          <i class="fa-solid fa-user-astronaut display-2 text-white"></i>
        </div>
        <div class="status-indicator online"></div>
      </div>
      <h2 class="fw-bold text-dark mb-1">{{ actualizarPerfilForm.get('nombre')?.value || 'Usuario' }}</h2>
      <p class="text-muted small text-uppercase fw-bold ls-1">Ciudadano Participativo</p>
    </div>

    <!-- Form Section -->
    <div class="profile-body p-4 p-lg-5">
      <form [formGroup]="actualizarPerfilForm" (ngSubmit)="onSubmit()" novalidate>
        
        <div class="row g-4">
          <!-- Full Name -->
          <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Nombre Completo</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-user-pen"></i></span>
              <input type="text" class="form-control-modern" placeholder="Tu nombre" formControlName="nombre" 
                     [readonly]="!editando">
            </div>
          </div>

          <!-- Phone Number -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Teléfono</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-phone-volume"></i></span>
              <input type="text" class="form-control-modern" placeholder="Tu número" formControlName="telefono"
                     [readonly]="!editando">
            </div>
          </div>

          <!-- City -->
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Ciudad</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-building-flag"></i></span>
              <select class="form-select-modern" formControlName="ciudad" [attr.disabled]="!editando ? '' : null">
                <option value="">Selecciona tu ciudad</option>
                <option *ngFor="let ciudad of ciudades" [value]="ciudad">{{ ciudad }}</option>
              </select>
            </div>
          </div>

          <!-- Address -->
          <div class="col-12">
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Dirección de Residencia</label>
            <div class="input-group-modern">
              <span class="input-icon"><i class="fa-solid fa-map-location-dot"></i></span>
              <input type="text" class="form-control-modern" placeholder="Tu dirección" formControlName="direccion"
                     [readonly]="!editando">
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-5 d-flex flex-column flex-sm-row gap-3">
          <!-- Viewing State -->
          <ng-container *ngIf="!editando">
            <button type="button" class="btn btn-primary-modern flex-grow-1 py-3" (click)="activarEdicion()">
              <i class="fa-solid fa-user-gear me-2"></i> Editar mi Perfil
            </button>
            <button type="button" class="btn btn-light-modern px-4 py-3" (click)="cancelar()">
              <i class="fa-solid fa-house me-2"></i> Volver
            </button>
          </ng-container>

          <!-- Editing State -->
          <ng-container *ngIf="editando">
            <button type="submit" class="btn btn-success-modern flex-grow-1 py-3" [disabled]="actualizarPerfilForm.invalid">
              <i class="fa-solid fa-cloud-arrow-up me-2"></i> Guardar Cambios
            </button>
            <button type="button" class="btn btn-light-modern px-4 py-3" (click)="cancelar()">
              Finalizar
            </button>
          </ng-container>
        </div>
      </form>
    </div>
  </div>
</div>
